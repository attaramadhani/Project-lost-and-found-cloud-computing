server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Single Page Application (SPA) routing
    # Meneruskan seluruh rute URL ke index.html agar tidak 404 saat refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
