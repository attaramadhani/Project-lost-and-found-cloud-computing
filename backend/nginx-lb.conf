# Konfigurasi Nginx Load Balancer (VM 2 - Port 80)
# Algoritma Pembagian Beban: Round-Robin (Default)

upstream backend_cluster {
    # Meneruskan traffic ke 2 container backend
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # Header CORS agar dapat diakses dari Frontend di VM 1
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

    # Handle Preflight OPTIONS request
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Reverse Proxy Load Balancer untuk API
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable cache agar pembagian load balancer bergantian terlihat jelas
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # Root endpoint info
    location / {
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
    }
}
