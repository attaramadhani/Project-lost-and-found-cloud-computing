# Konfigurasi Nginx Load Balancer (VM 2 - Port 80)
# Algoritma Pembagian Beban: Round-Robin (Default)

upstream backend_cluster {
    # Meneruskan traffic ke 2 container backend
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Reverse Proxy Load Balancer untuk seluruh request dan API
    location / {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable cache agar pembagian load balancer bergantian terlihat jelas
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }
}
